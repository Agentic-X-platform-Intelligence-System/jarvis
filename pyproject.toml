[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axis"
version = "0.1.0"
description = "AXIS — Agentic X-platform Intelligence System (Jarvis monorepo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pvporcupine>=3.0.2",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.10",
    "imageio-ffmpeg>=0.5.1",
    "duckduckgo-search>=6.1.0",
    "pyperclip>=1.8.2",
    "typer>=0.12.0",
]

[project.optional-dependencies]
coqui = [
    "TTS>=0.22.0",
    "torch",
]
windows = [
    "pycaw>=20240210",
    "comtypes>=1.4.0",
]

[project.scripts]
jarvis-voice = "apps.voice.main:main"
jarvis-cli = "apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["stem", "aura", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
